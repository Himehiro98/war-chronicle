name: Check live conflict data freshness

# 以前は日付だけを毎週書き換えていたが、中身が古いまま「最新」に見えてしまうため廃止。
# 代わりに、編集部の確認日（LIVE_DATA_REVIEWED）が古くなったら Issue で知らせる。
# データの更新は lib/live-conflicts.ts と lib/content-updates-2026.ts を人が見直して行う。

on:
  schedule:
    # 毎週月曜 9:00 JST (UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check review date
        id: check
        run: |
          REVIEWED=$(grep -oP "LIVE_DATA_REVIEWED = '\K[0-9-]+" lib/live-conflicts.ts)
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$REVIEWED" +%s) ) / 86400 ))
          echo "reviewed=$REVIEWED" >> $GITHUB_OUTPUT
          echo "age=$AGE_DAYS" >> $GITHUB_OUTPUT
          echo "## Live data last reviewed: $REVIEWED ($AGE_DAYS days ago)" >> $GITHUB_STEP_SUMMARY

      - name: Open reminder issue if stale (45+ days)
        if: ${{ steps.check.outputs.age >= 45 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="進行中の戦争データの見直し（最終確認 ${{ steps.check.outputs.reviewed }}）"
          if gh issue list --state open --search "進行中の戦争データの見直し in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --title "$TITLE" --body "lib/live-conflicts.ts の最終確認から ${{ steps.check.outputs.age }} 日経過しました。

          - [ ] 各紛争の数値・最新動向を確認して更新（asOf / latestDate も）
          - [ ] lib/content-updates-2026.ts（戦争ページの最新状況）を見直し
          - [ ] 終結・新規の紛争があれば lib/wars.ts の ongoing を更新
          - [ ] LIVE_DATA_REVIEWED を確認日に変更"
          fi
